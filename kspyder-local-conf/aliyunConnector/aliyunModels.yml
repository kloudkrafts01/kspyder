# ================ Elastic Compute Service Models ==================

    ECSInstances:
        API: ECS
        request_builder: DescribeInstancesRequest
        query_name: describe_instances_with_options
        response_map: 
            data: Instances.Instance[]
        accepted_inputs:
            - region_id
        index_keys:
            - InstanceId
            - InstanceName

    ECSImages:
        API: ECS
        request_builder: DescribeImagesRequest
        query_name: describe_images_with_options
        response_map: 
            data: Images.Image[]
        accepted_inputs:
            - region_id
            - image_owner_alias
        index_keys:
            - ImageId
            - ImageName
            - ImageOwnerAlias

    AvailableECStypes:
        API: ECS
        request_builder: DescribeAvailableResourceRequest
        query_name: describe_available_resource_with_options
        paginate: false
        response_map:
            data: AvailableZones.AvailableZone[]
        accepted_inputs:
            - region_id
            - destination_resource
        index_keys:
            - RegionId
            - ZoneId

    NetworkSecurityGroups:
        API: ECS
        request_builder: DescribeSecurityGroupsRequest
        query_name: describe_security_groups_with_options
        response_map: 
            data: SecurityGroups.SecurityGroup[]
        accepted_inputs:
            - region_id
        index_keys:
            - SecurityGroupId

    NSGRules:
        API: ECS
        request_builder: DescribeSecurityGroupAttributeRequest
        query_name: describe_security_group_attribute_with_options
        response_map: 
            data: Permissions.Permission[]
        accepted_inputs:
            - region_id
            - security_group_id
        index_keys:
            - SecurityGroupRuleId

  # ================ Load Balancers Models ==================

    ClassicLoadBalancers:
        API: SLB_by_pages
        api_namespace: SLB
        request_builder: DescribeLoadBalancersRequest
        query_name: describe_load_balancers_with_options
        response_map:
            data: LoadBalancers.LoadBalancer[]
        accepted_inputs:
            - region_id
        index_keys:
            - LoadBalancerId

    CLBAttributes:
        API: SLB_by_pages
        api_namespace: SLB
        request_builder: DescribeLoadBalancerAttributeRequest
        query_name: describe_load_balancer_attribute_with_options
        paginated: false
        response_map:
            data: __ROOT__
        accepted_inputs:
            - region_id
            - load_balancer_id
        index_keys:
            - LoadBalancerId

    LoadBalancerListeners:
        API: SLB_by_tokens
        api_namespace: SLB
        request_builder: DescribeLoadBalancerListenersRequest
        query_name: describe_load_balancer_listeners_with_options
        response_map:
            data: Listeners[]
        accepted_inputs:
            - region_id
            - next_token
            - max_results
        index_keys:
            - LoadBalancerId
            - AclId
            - VServerGroupId

    LBForwardingRules:
        API: SLB_by_tokens
        api_namespace: SLB
        request_builder: DescribeRulesRequest
        query_name: describe_rules_with_options
        response_map:
            data: Rules.Rule[]
        accepted_inputs:
            - region_id
            - load_balancer_id
            - listener_port
        index_keys:
            - RuleId

    VServerGroups:
        API: SLB_by_tokens
        api_namespace: SLB
        request_builder: DescribeVServerGroupsRequest
        query_name: describe_vserver_groups_with_options
        response_map:
            data: VServerGroups.VServerGroup[]
        accepted_inputs:
            - region_id
            - load_balancer_id
        index_keys:
            - VServerGroupId

    VServerGroupAttributes:
        API: SLB_by_tokens
        api_namespace: SLB
        request_builder: DescribeVServerGroupAttributeRequest
        query_name: describe_vserver_group_attribute_with_options
        response_map:
            data: __ROOT__
        accepted_inputs:
            - region_id
            - vserver_group_id
        index_keys:
            - LoadBalancerId
            - VServerGroupId

  # ================ Yundun / Cloud Security Models ==================

    FirewallPoliciesInternet:
        API: Security
        request_builder: DescribeControlPolicyRequest
        query_name: describe_control_policy_with_options
        accepted_inputs:
            - current_page
            - page_size
            - direction
        response_map:
            data: Policys[]
        index_keys:
            - PolicyId