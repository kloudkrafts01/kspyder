Steps:

  - Name: GetToMongo.RouteTables
    Job: get_data_to_mongo
    Output: AzureRouteTables
    Params:
      from_worker: azureRGraph
      model_name: RouteTables

  - Name: ExtractVnetTabularData
    Worker: mongoDB
    Job: aggregate_data
    Output: AzureVnetData
    Params:
      save_to: AzureVnetData
      collection_name: AzureVirtualNetworks
      pipeline:
        - $unwind: $properties.addressSpace.addressPrefixes
        - $project:
            environment: $tags.environment
            name: 1
            region: $location
            subscriptionId: 1
            resourceGroup: 1
            CIDR: $properties.addressSpace.addressPrefixes
            dnsServers: $properties.dhcpOptions.dnsServers

  - Name: Extract.VnetPeerings
    Worker: mongoDB
    Job: aggregate_data
    Output: AzureVnetPeeringsRaw
    Params:
      save_to: Azure.Vnet.PeeringsRaw
      collection_name: AzureVirtualNetworks
      pipeline:
        - $unwind: $properties.addressSpace.addressPrefixes
        - $unwind: $properties.virtualNetworkPeerings
        - $project:
            environment: $tags.environment
            name: 1
            region: $location
            subscriptionId: 1
            resourceGroup: 1
            CIDR: $properties.addressSpace.addressPrefixes
            peeringConfig: $properties.virtualNetworkPeerings
  
  - Name: Extract.VnetPeeringsData
    Worker: mongoDB
    Job: aggregate_data
    Output: AzureVnetPeeringsData
    DumpCSV: true
    Params:
      save_to: Azure.Vnet.PeeringsData
      collection_name: Azure.Vnet.PeeringsRaw
      pipeline:
        - $unwind: $peeringConfig.properties.remoteVirtualNetworkAddressSpace.addressPrefixes
        - $project:
            environment: 1
            region: 1
            peering_name: $peeringConfig.properties.name
            vnet_subscriptionId: $subscriptionId
            vnet_resourceGroup: $resourceGroup
            vnet_name: $name
            vnet_CIDR: $CIDR
            peer_resourceGroup:
              $arrayElemAt:
                - $split:
                  - $peeringConfig.properties.remoteVirtualNetwork.id
                  - "/"
                - 4
            peer_name: 
              $arrayElemAt:
                - $split:
                  - $peeringConfig.properties.remoteVirtualNetwork.id
                  - "/"
                - -1
            peer_CIDR: $peeringConfig.properties.remoteVirtualNetworkAddressSpace.addressPrefixes
            provisioningState: $peeringConfig.properties.provisioningState
            peeringState: $peeringConfig.properties.peeringState
            allowForwardedTraffic: $peeringConfig.properties.allowForwardedTraffic
            allowGatewayTransit: $peeringConfig.properties.allowGatewayTransit
            useRemoteGateways: $peeringConfig.properties.useRemoteGateways
            allowVirtualNetworkAccess: $peeringConfig.properties.allowVirtualNetworkAccess
            

  - Name: ExtractSubnetTabularData
    Worker: mongoDB
    Job: aggregate_data
    Output: AzureSubnetData
    Params:
      save_to: AzureSubnetData
      collection_name: AzureVirtualNetworks
      pipeline:
        - $unwind: $properties.subnets
        - $set:
            ipConfigs: $properties.subnets.properties.ipConfigurations
        - $match:
            ipConfigs:
              $exists: true
        - $project:
            environment: $tags.environment
            vnetName: $name
            region: $location
            subscriptionId: 1
            resourceGroup: 1
            vnetDnsServers: $properties.dhcpOptions.dnsServers
            subnetName: $properties.subnets.name
            subnetCIDR: $properties.subnets.properties.addressPrefix
            subnetPurpose: $properties.subnets.purpose
            # ipConfigs: 1
            usedIpAddresses: 
              $size: $ipConfigs
            hasPrivateEndpoints: $properties.subnets.properties.privateEndpointNetworkPolicies
            hasPrivateLinks: $properties.subnets.properties.privateLinkServiceNetworkPolicies

