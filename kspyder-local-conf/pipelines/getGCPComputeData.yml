Steps:

  - Name: GetProjectZones
    Worker: mongoDB
    Job: aggregate_data
    Output: GCPProjectZones
    Params:
      collection_name: GCPProjectZones
      pipeline:
        - $unset:
            - _id
  
  - Name: GetToMongo.ComputeInstances
    Job: get_data_to_mongo
    Input: GCPProjectZones.data
    Output: GCloudComputeInstances
    Params:
      from_worker: gcloud
      model_name: ComputeInstances

  - Name: GetToMongo.RegionalTargetHttpProxies
    Job: get_data_to_mongo
    Input: GCPProjectZones.data
    Output: RegionalTargetHttpProxies
    Params:
      from_worker: gcloud
      model_name: RegionalTargetHttpProxies

