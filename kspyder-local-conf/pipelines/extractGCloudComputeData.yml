Steps:

  - Name: Extract.ComputeInstanceData
    Worker: mongoDBConnector
    Job: aggregate_data
    Output: ComputeInstanceData
    DumpCSV: true
    Params:
      save_to: GCloud.Compute.ComputeInstanceData
      collection_name: GCloud.Compute.ComputeInstances
      pipeline:
        - $unwind: 
            path: $network_interfaces
            preserveNullAndEmptyArrays: true
        - $project:
            project: 1
            name: 1
            id: 1
            env: $labels.lvmh_environment
            app_name: $labels.lvmh_application
            machine_type:
              $arrayElemAt:
                - $split:
                  - $machine_type
                  - "/"
                - -1
            status: 1
            vpc:
              $arrayElemAt:
                - $split:
                  - $network_interfaces.network
                  - "/"
                - -1
            subnet:
              $arrayElemAt:
                - $split:
                  - $network_interfaces.subnetwork
                  - "/"
                - -1
            zone:
              $arrayElemAt:
                - $split:
                  - $zone
                  - "/"
                - -1
            primary_ip: $network_interfaces.network_i_p
