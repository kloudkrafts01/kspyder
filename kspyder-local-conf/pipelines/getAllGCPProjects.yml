Steps:

  - Name: GetFolderIdsFromMongo
    Worker: mongoDBConnector
    Job: aggregate_data
    Output: GCloudFoldersIds
    Params:
      collection_name: GCloud.RM.Folders
      pipeline:
        - $match:
            name:
              $not:
                $regex: organizations
        - $project:
            parent: $name
        - $unset:
            - _id

