Steps:

  - Name: GetProjectIds
    Worker: mongoDB
    Job: aggregate_data
    Output: GCPProjectIds
    Params:
      collection_name: GCPProjects
      pipeline:
        - $project:
            project: $project_id
        - $unset:
          - _id

