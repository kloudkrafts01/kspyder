Steps:

  - Name: GetVPCs
    Job: get_data_to_mongo
    Output: AliyunVPCs
    Params:
      from_worker: aliyunCLI
      model_name: VPCs
      last_days: null

  - Name: GetVSwitches
    Job: get_data_to_mongo
    Output: AliyunVSwitches
    Params:
      from_worker: aliyunCLI
      model_name: VSwitches
      last_days: null

  - Name: Extract.RouteTableIds
    Worker: mongoDB
    Job: aggregate_data
    Output: RouteTableIds
    Params:
      collection_name: Aliyun.VPC.VSwitches
      pipeline:
        - $project:
            RouteTableId: $RouteTable.RouteTableId
        - $unset:
          - _id

